<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">rdap logo</title>
  <desc id="desc">A blue rounded square containing a cream globe with two calendar rings on top and three connected nameserver nodes below.</desc>

  <rect x="12" y="12" width="488" height="488" rx="126" fill="#3D7BE0"/>

  <!-- Globe -->
  <circle cx="256" cy="226" r="112" fill="#FFF9F3" stroke="#173A73" stroke-width="10"/>
  <g fill="none" stroke="#173A73" stroke-width="10" stroke-linecap="round">
    <ellipse cx="256" cy="226" rx="52" ry="112"/>
    <path d="M256 114v224"/>
    <path d="M144 226h224"/>
    <path d="M159 170q97 32 194 0"/>
    <path d="M159 282q97-32 194 0"/>
  </g>

  <!-- Calendar rings -->
  <g fill="#FFF9F3" stroke="#173A73" stroke-width="10">
    <rect x="194" y="82" width="36" height="72" rx="18"/>
    <rect x="282" y="82" width="36" height="72" rx="18"/>
  </g>

  <!-- Nameserver nodes -->
  <path d="M150 404h212" fill="none" stroke="#173A73" stroke-width="18" stroke-linecap="round"/>
  <g fill="#FFF9F3" stroke="#173A73" stroke-width="10">
    <circle cx="150" cy="404" r="28"/>
    <circle cx="256" cy="404" r="28"/>
    <circle cx="362" cy="404" r="28"/>
  </g>
</svg>
